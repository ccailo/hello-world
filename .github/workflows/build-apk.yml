name: Build FlightVR Stereo APK
on:
  push:
    branches: [ "flightvr-stereo-v2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FlightVR-Stereo-v2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlightVR-Stereo-v2-APK
          path: FlightVR-Stereo-v2-debug.apk
          if-no-files-found: error
