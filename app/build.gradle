plugins { id 'com.android.application' }

android {
    namespace 'br.com.flightvr.stereo'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.flightvr.stereo'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0-stereo'
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
